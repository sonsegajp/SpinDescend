<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Spin &amp; Descend</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; }
  #gl { cursor: pointer; touch-action: none; }
  #load { width: 100%; height: 100%; image-rendering: pixelated; z-index: 2; }
  #err { display: none; position: absolute; left: 16px; right: 16px; top: 16px; padding: 12px; white-space: pre-wrap;
         font: 12px monospace; color: #ffd0d0; background: rgba(40, 0, 0, 0.9); border: 1px solid #a33; z-index: 5; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="load"></canvas>
<div id="err"></div>
<script>
window.SD_ASSETS = "./assets/"; window.SD_BUILD = "20260925234300";
(function () {
  var start = function () {
    var s = document.createElement('script');
    s.type = 'module'; s.src = 'src/main.js?v=' + window.SD_BUILD;
    document.body.appendChild(s);
  };
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
    if (v.build && v.build !== window.SD_BUILD) {
      var key = 'sd_reload_' + v.build, tried = null;
      try { tried = sessionStorage.getItem(key); sessionStorage.setItem(key, '1'); } catch (e) { tried = '1'; }
      if (!tried) { var u = new URL(location.href); u.searchParams.set('b', v.build); location.replace(u.toString()); return; }
    }
    start();
  }).catch(start);
})();
</script>
</body>
</html>
